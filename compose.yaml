services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easyearn
      POSTGRES_USER: easyearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyearn_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyearn -d easyearn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
