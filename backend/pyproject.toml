[project]
name = "easyearn-backend"
version = "0.1.0"
description = "Easyearn account platform by Nies Technologies"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "bcrypt>=4.2,<6",
    "cryptography>=44,<49",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires TEST_DATABASE_URL and an isolated PostgreSQL schema",
    "redis: requires TEST_REDIS_URL and uses short-lived, uniquely prefixed keys",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/dependencies.py" = ["B008"]
"app/api/router.py" = ["B008"]
"app/modules/auth/router.py" = ["B008"]
